server {
    listen 80;
    server_name _;

    # Serve React static files
    root /usr/share/nginx/html;
    index index.html;

    # Django static files (admin CSS/JS, collectstatic output)
    location /static/ {
        alias /app/staticfiles/;
    }

    # Django media files
    location /media/ {
        alias /app/mediafiles/;
    }

    # Forward API requests to Django container
    location /api/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django admin only — React app admin lives at /admin/dashboard, etc.
    location /admin/admin/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    location = /admin/admin {
        return 301 /admin/admin/;
    }

    # All other routes go to the React app (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
