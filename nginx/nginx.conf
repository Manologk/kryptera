server {
    listen 80;
    server_name _;

    # Serve React static files
    root /usr/share/nginx/html;
    index index.html;

    # Django statis files
    location /static/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /media/ {
        alias /app/mediafiles/;
    }
    # Let Nginx serve files directly from the volume

    # Forwad API requests to Django container
    # "django" here is the container name defined in the docker-compose.yml
    location /api/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }


    # Forward Django admin requests to Django container
    location /admin/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # All other routes go to the React app
    # This handles client-side routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    # error_page 404 /index.html;
    # location = /index.html {
    #     internal;
    # }
}