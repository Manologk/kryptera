<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Identity verification approved</title>
  <style>
    body { margin: 0; background: #f0ede8; font-family: 'Segoe UI', Arial, sans-serif; color: #1a1a1a; padding: 32px 16px; }
    .wrapper { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #e8e5e0; }
    .header { background: #0f2d1f; padding: 24px 32px; color: #d4edd7; font-size: 20px; font-weight: 600; }
    .card { padding: 32px; }
    h1 { margin: 0 0 12px; font-size: 24px; color: #0f2d1f; line-height: 1.3; }
    p { margin: 0 0 16px; font-size: 15px; line-height: 1.7; color: #4a4a4a; }
    .status { background: #edfaf2; border-left: 4px solid #3dbd6b; padding: 14px 18px; margin: 24px 0; border-radius: 0 8px 8px 0; }
    .status strong { display: block; color: #0f7a3c; }
    .cta { text-align: center; margin: 28px 0 8px; }
    .cta a { display: inline-block; background: #0f2d1f; color: #d4edd7; text-decoration: none; padding: 12px 28px; border-radius: 8px; font-weight: 600; }
    .note { font-size: 13px; color: #888; border-top: 1px solid #f0ede8; padding-top: 20px; margin-top: 24px; }
    .footer { background: #0f2d1f; color: #6a9a78; text-align: center; padding: 18px 32px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">{{ company_name }}</div>
    <div class="card">
      <h1>You're verified, {{ user_name }}.</h1>
      <p>Your identity has been approved. You can now create transfers on {{ company_name }}.</p>

      <div class="status">
        <strong>Identity verified</strong>
      </div>

      <div class="cta">
        <a href="{{ home_url }}">Start a transfer</a>
      </div>

      <p class="note">Questions? Contact us at <a href="mailto:{{ support_email }}">{{ support_email }}</a>.</p>
    </div>
    <div class="footer">© {% now "Y" %} {{ company_name }}</div>
  </div>
</body>
</html>
